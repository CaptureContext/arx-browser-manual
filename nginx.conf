map "${RAILWAY_ENVIRONMENT_NAME}" $robots_tag {
  default "noindex, nofollow";
  production "";
}

server {
  listen ${PORT};
  listen [::]:${PORT};

  # Railway terminates TLS before proxying to this container. Keep directory
  # redirects relative so nginx does not expose its internal HTTP port.
  absolute_redirect off;

  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  add_header X-Robots-Tag $robots_tag always;

  # Pages are files: /path/index.html or /path.html. Directories are never
  # listed, so a folder of assets without a page gets the site's 404 page
  # instead of nginx's 403.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }

  # Nuxt's build assets have content hashes in their names, so they never change.
  location /_nuxt/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    add_header X-Robots-Tag $robots_tag always;
    try_files $uri =404;
  }

  location = /404.html {
    internal;
  }

  error_page 403 404 =404 /404.html;

  gzip on;
  gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;
}
